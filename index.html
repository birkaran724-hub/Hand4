<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hand Laser FX</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden}
  #canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;display:block}
  #hud{position:fixed;top:12px;left:12px;z-index:2;font-family:monospace;display:flex;flex-direction:column;gap:6px}
  .s{background:rgba(0,0,0,0.7);border:1px solid #0f0;color:#0f0;font-size:13px;padding:5px 10px}
  #overlay{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;font-size:14px;font-family:monospace;text-align:center;padding:20px}
  #startBtn{padding:14px 36px;background:#ff0000;border:none;color:#fff;font-size:16px;font-family:monospace;cursor:pointer;border-radius:4px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div class="s" id="sh">Hands: 0</div>
  <div class="s" id="sf">FPS: -</div>
  <div class="s" id="sd">-</div>
</div>
<div id="overlay">
  <div id="msg">Tap the button to start</div>
  <button id="startBtn" onclick="startCamera()">START CAMERA</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const overlay= document.getElementById('overlay');
const sh     = document.getElementById('sh');
const sf     = document.getElementById('sf');
const sd     = document.getElementById('sd');
const msg    = document.getElementById('msg');

const video  = document.createElement('video');
video.autoplay=true; video.muted=true; video.playsInline=true;

let detector=null, running=false, fc=0, lastT=performance.now();

function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize',resize); resize();

async function loop(){
  if(!running) return;
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const cw=canvas.width, ch=canvas.height;

  // Draw camera
  if(video.readyState>=2){
    const vw=video.videoWidth||640, vh=video.videoHeight||480;
    const vr=vw/vh, cr=cw/ch;
    let dw,dh,dx,dy;
    if(vr>cr){dh=ch;dw=ch*vr;dx=(cw-dw)/2;dy=0;}
    else{dw=cw;dh=cw/vr;dx=0;dy=(ch-dh)/2;}
    ctx.save();
    ctx.translate(cw,0); ctx.scale(-1,1);
    ctx.drawImage(video,cw-dx-dw,dy,dw,dh);
    ctx.restore();
  }

  // Detect
  let hands=[];
  if(video.readyState>=2&&detector){
    try{ hands=await detector.estimateHands(video,{flipHorizontal:false}); }catch(e){}
  }

  sh.textContent='Hands: '+hands.length;

  if(hands.length>0){
    const kps=hands[0].keypoints;
    const vw=video.videoWidth||640, vh=video.videoHeight||480;
    const vr=vw/vh, cr=cw/ch;
    let dw,dh,dx,dy;
    if(vr>cr){dh=ch;dw=ch*vr;dx=(cw-dw)/2;dy=0;}
    else{dw=cw;dh=cw/vr;dx=0;dy=(ch-dh)/2;}

    // Show raw coords of wrist for debug
    sd.textContent=`wrist raw: ${Math.round(kps[0].x)},${Math.round(kps[0].y)}`;

    // Draw ALL keypoints as big red circles
    ctx.fillStyle='#ff0000';
    ctx.strokeStyle='#ffff00';
    ctx.lineWidth=3;
    kps.forEach((kp,i)=>{
      // mirror x to match video display
      const mx=1-(kp.x/vw);
      const x=dx+mx*dw;
      const y=dy+(kp.y/vh)*dh;
      ctx.beginPath();
      ctx.arc(x,y,18,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
      // label
      ctx.fillStyle='#fff';
      ctx.font='bold 12px monospace';
      ctx.fillText(i,x-4,y+4);
      ctx.fillStyle='#ff0000';
    });

    // Draw thick yellow lines between wrist and all fingertips
    const TIPS=[4,8,12,16,20];
    const wrist=kps[0];
    const wx=dx+(1-(wrist.x/vw))*dw;
    const wy=dy+(wrist.y/vh)*dh;
    TIPS.forEach(i=>{
      const kp=kps[i];
      const tx=dx+(1-(kp.x/vw))*dw;
      const ty=dy+(kp.y/vh)*dh;
      ctx.beginPath();
      ctx.moveTo(wx,wy);
      ctx.lineTo(tx,ty);
      ctx.strokeStyle='#ffff00';
      ctx.lineWidth=8;
      ctx.stroke();
    });
  } else {
    sd.textContent='No hands';
  }

  fc++;
  const now=performance.now();
  if(now-lastT>800){
    sf.textContent='FPS: '+Math.round(fc/((now-lastT)/1000));
    fc=0; lastT=now;
  }
  requestAnimationFrame(loop);
}

async function startCamera(){
  msg.textContent='Starting camera...';
  document.getElementById('startBtn').style.display='none';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}
    });
    video.srcObject=stream;
    await new Promise(r=>{video.onloadedmetadata=r;});
    video.play();
    msg.textContent='Loading AI model... (wait ~10 sec)';
    detector=await handPoseDetection.createDetector(
      handPoseDetection.SupportedModels.MediaPipeHands,
      {runtime:'tfjs',modelType:'lite',maxHands:2}
    );
    overlay.style.display='none';
    running=true;
    loop();
  }catch(e){
    msg.textContent='ERROR: '+e.message;
    msg.style.color='#f00';
    document.getElementById('startBtn').style.display='block';
    document.getElementById('startBtn').textContent='RETRY';
  }
}
</script>
</body>
</html>
